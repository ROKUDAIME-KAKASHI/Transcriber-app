name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders only. Nothing in CI connects to a database or calls an AI provider;
      # these just let Prisma generate and `next build` load their config.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-0000000000
      NEXTAUTH_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check generated service worker and shells
        run: npm run check-build

      - name: First-load JS budget
        run: npm run bundle-budget

      - name: Smoke test (no database)
        run: npm run smoke
