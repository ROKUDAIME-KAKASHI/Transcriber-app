services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: transcriber
      POSTGRES_PASSWORD: transcriber_password
      POSTGRES_DB: transcriber_db
    ports:
      - "5433:5432" # 5432 is used by the Life OS database
    volumes:
      - transcriber_pgdata:/var/lib/postgresql/data

volumes:
  transcriber_pgdata:
