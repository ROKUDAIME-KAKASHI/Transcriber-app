<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Transcriber</title>
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #6b6560; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --accent: #818cf8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; text-align: center; }
    p { color: var(--muted); max-width: 22rem; }
    button { margin-top: 12px; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600;
      background: var(--accent); color: #fff; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Live transcription needs an internet connection. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
